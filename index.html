<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Admissão</title>

</head>
<body>
    <form onsubmit="alert('Formulário enviado com sucesso!')" action="" method="post">
      <h1> Formulário de Admissão  </h1> 
      <label> Preencha os campos abaixo: </label> <br> <br>
      <input type="text" placeholder="Nome Completo" required> <br> <br>
    <label> Sexo: </label> <br>
        <input type="radio" name="sexo" value="masculino" required> Masculino 
        <input type="radio" name="sexo" value="feminino" required> Feminino
        <input type="radio" name="sexo" value="outro" required> Outro
        <br> <br>
       
        <input type="email" placeholder="Email" required> <br> <br>

        <input type="number" placeholder="Idade" min="1" max="99"  required> <br> <br>

        <input type="tel" placeholder="Número de telefone" maxlength="11" required> <br> <br>

        <input type="text" placeholder="Endereço" required> <br> <br>
        <label> Estado: </label> <br> <br>
        <select>
            <option value="" disabled selected>Selecione o estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>

        
        </select> <br> <br>
            
        <input type="text" placeholder="Digite o nome da Cidade" required> <br> <br>
            
        

    <label> Cargo de contrato : </label> <br> <br>
        <select>
        
            <option value="" disabled selected>Selecione o cargo</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Gerente">Gerente</option>
            <option value="Escravo">Escravo</option>
            <option value="Estagiário">Estagiário</option>
        </select> <br> <br>
        <label> Turno de trabalho: </label> <br>
        <input type="radio" name="turno" value="manha" required> Manhã 
        <input type="radio" name="turno" value="tarde" required> Tarde
        <br> <br>
        <input type="radio" name="Termos" value="aceito" required> Aceito os termos e condições do contrato
        <br> <br>


        <input type="submit" value="Enviar formulário de admissão">

     







    </form>
    
</body>
</html>
